spring.application.name=codeexecution
spring.mongodb.uri=mongodb://localhost:27017/codeexecution
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.config.import=optional:file:.env[.properties]

# JWT
# Use a random secret of at least 32 bytes (256 bits), e.g. generated with:
# openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Access token: 15 minutes
jwt.access-token-expiration=900000
# Refresh token: 7 days
jwt.refresh-token-expiration=604800000

# Mail (SMTP) - used to send OTP verification and password-reset emails.
# For Gmail use an app password: https://myaccount.google.com/apppasswords
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.from=${MAIL_REPLY_FROM}

# OTP verification (email code)
# How long an OTP stays valid: 10 minutes
app.otp.ttl-ms=600000
# Wrong-code attempts before the OTP is invalidated
app.otp.max-attempts=5
# Minimum wait between two OTP requests for the same user: 60 seconds
app.otp.resend-cooldown-ms=60000

# Password reset token
# How long a reset token stays valid: 15 minutes
app.password-reset.ttl-ms=900000

# Create Mongo indexes on startup (unique slug, unique role/permission names)
spring.data.mongodb.auto-index-creation=true

# Problem testcase uploads (multipart + local file storage)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.storage.problems-dir=./storage/problems

# Code execution (queues, workers, Docker exec into existing containers)
# Per-language Redis queues: queue:cpp, queue:java, queue:python, queue:javascript
app.execution.queue-prefix=queue:
# Worker threads polling the queues (one per language); non-blocking RPOP
# every interval so the shared Lettuce connection stays free
app.execution.workers-enabled=true
app.execution.worker-poll-interval-ms=250
# Host directory holding per-submission source files (staged before docker cp)
app.execution.work-dir=./storage/executions
# Docker daemon endpoint. Pinned to the local socket on purpose: an
# inherited DOCKER_HOST (e.g. from .env) previously pointed at a dead TCP
# endpoint and broke judging with "Connection refused".
app.execution.docker-host=unix:///var/run/docker.sock
# Centralized runtime registry: language -> EXISTING container name.
# Code runs via `docker exec` inside these containers, so they must exist
# on this machine (create them once, e.g. from backend/docker/*).
# A language with no entry is unavailable (submit returns a clear 400).
app.execution.containers.cpp=cpp
app.execution.containers.java=java
app.execution.containers.python=python
# Optional exec user override; empty = the container's default user
app.execution.container-user=
# Extra wall-clock allowance on top of the per-testcase time limit
# (covers container start + interpreter startup)
app.execution.run-grace-ms=1500
# Compile phase budget (g++ / javac)
app.execution.compile-timeout-ms=15000
app.execution.compile-memory-kb=524288
# Stored stdout/stderr are truncated to this many characters
app.execution.io-truncate-chars=4096
# Hard cap on submitted source code
app.execution.max-code-chars=100000
# Max PID limit / CPU share for sandbox containers
app.execution.pids-limit=64

# RBAC seeding (idempotent, runs at startup)
app.rbac.seed.enabled=true
app.rbac.seed.admin-email=${ROOT_ADMIN_EMAIL:admin@example.com}
app.rbac.seed.admin-password=${ROOT_ADMIN_PASSWORD:Admin@123!}
