spring.application.name=codeexecution
spring.mongodb.uri=mongodb://localhost:27017/codeexecution
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.config.import=optional:file:.env[.properties]

# JWT
# Use a random secret of at least 32 bytes (256 bits), e.g. generated with:
# openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Access token: 15 minutes
jwt.access-token-expiration=900000
# Refresh token: 7 days
jwt.refresh-token-expiration=604800000

# Mail (SMTP) - used to send OTP verification and password-reset emails.
# For Gmail use an app password: https://myaccount.google.com/apppasswords
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.from=${MAIL_REPLY_FROM}

# OTP verification (email code)
# How long an OTP stays valid: 10 minutes
app.otp.ttl-ms=600000
# Wrong-code attempts before the OTP is invalidated
app.otp.max-attempts=5
# Minimum wait between two OTP requests for the same user: 60 seconds
app.otp.resend-cooldown-ms=60000

# Password reset token
# How long a reset token stays valid: 15 minutes
app.password-reset.ttl-ms=900000
