<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="CodeForge — master DSA, crack interviews. Curated problems, visual debuggers and FAANG-grade mock interviews." />
  <title>CodeForge — Master DSA. Crack interviews.</title>
  <script>
    // Apply the persisted theme before first paint so there is no flash.
    ; (function () {
      try {
        var mode = localStorage.getItem('cf.theme') || 'system'
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.classList.remove('dark')
      }
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
